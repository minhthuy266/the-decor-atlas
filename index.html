<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="description" content="A minimalist, sophisticated interior design blog featuring high-quality photography, curated home decor, and architectural inspiration." />
    <meta name="p:domain_verify" content="ecd139aa26a9e8fd9f666d3379a8bd99"/>
    <title>The Decor Atlas</title>
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload Tenor Sans as it is the display font for LCP elements -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap"></noscript>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              serif: ['Tenor Sans', 'sans-serif'], 
              display: ['Tenor Sans', 'sans-serif'],
            },
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                400: '#a8a29e',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#292524',
                900: '#111110',
              }
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slow-zoom': 'slowZoom 20s infinite alternate',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slowZoom: {
                '0%': { transform: 'scale(1)' },
                '100%': { transform: 'scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fafaf9;
        color: #111110;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      
      /* Reset scroll behavior to allow JS full control without conflicts */
      html {
        scroll-behavior: auto !important;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* --- Ghost Content Styles --- */
      .gh-content {
        font-family: 'Manrope', sans-serif;
        font-weight: 300;
        color: #44403c;
        line-height: 1.8;
        font-size: 1.05rem;
        max-width: 100%;
        overflow-wrap: break-word;
      }

      /* Fix triệt để vấn đề bị che tiêu đề trên Mobile */
      .gh-content h1, .gh-content h2, .gh-content h3, 
      .gh-content h4, .gh-content h5, .gh-content h6 {
        font-family: 'Tenor Sans', sans-serif;
        color: #111110;
        font-weight: 400;
        letter-spacing: 0.05em; 
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        line-height: 1.3;
        text-transform: uppercase;
        /* Scroll margin là cứu cánh tốt nhất cho mobile safari */
        scroll-margin-top: 100px !important;
      }
      
      @media (min-width: 768px) {
        .gh-content h1, .gh-content h2, .gh-content h3 {
            scroll-margin-top: 120px !important;
        }
      }

      .gh-content h2 { font-size: 1.5rem; border-bottom: 1px solid #e7e5e4; padding-bottom: 0.5rem; }
      .gh-content h3 { font-size: 1.25rem; }
      
      @media (min-width: 768px) {
        .gh-content h2 { font-size: 2rem; }
        .gh-content h3 { font-size: 1.5rem; }
      }

      /* Các style khác giữ nguyên */
      .gh-content p { margin-bottom: 1.5rem; }
      .gh-content blockquote {
        border-left: 2px solid #111110;
        padding-left: 1.5rem;
        margin: 2.5rem 0;
        font-family: 'Tenor Sans', sans-serif;
        font-size: 1.25rem;
        color: #111110;
        line-height: 1.4;
      }

      .gh-content a {
        color: #111110;
        text-decoration: underline;
        text-decoration-color: #d6d3d1;
        text-underline-offset: 4px;
        transition: all 0.2s;
      }
      
      .da-internal-card {
        margin: 3.5rem 0;
        background: #fff;
        border: 1px solid #d6d3d1; 
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        overflow: hidden;
      }
    </style>

{
  "imports": {

    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "path": "https://esm.sh/path@^0.12.7"
  }
}
</script>
</head>

</html>
