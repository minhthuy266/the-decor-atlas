<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="description" content="A minimalist, sophisticated interior design blog featuring high-quality photography, curated home decor, and architectural inspiration." />
    <meta name="p:domain_verify" content="ecd139aa26a9e8fd9f666d3379a8bd99"/>
    <title>The Decor Atlas</title>
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload Tenor Sans as it is the display font for LCP elements -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tenor+Sans&display=swap"></noscript>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              serif: ['Tenor Sans', 'sans-serif'], 
              display: ['Tenor Sans', 'sans-serif'],
            },
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                400: '#a8a29e',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#292524',
                900: '#111110',
              }
            },
            animation: {
              'marquee': 'marquee 25s linear infinite',
              'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slow-zoom': 'slowZoom 20s infinite alternate',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slowZoom: {
                '0%': { transform: 'scale(1)' },
                '100%': { transform: 'scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fafaf9;
        color: #111110;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .bg-fixed-parallax {
        background-attachment: fixed;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
      @media (hover: none) { .bg-fixed-parallax { background-attachment: scroll; } }

      /* --- Ghost Content Styles --- */
      .gh-content {
        font-family: 'Manrope', sans-serif;
        font-weight: 300;
        color: #44403c;
        line-height: 1.8;
        font-size: 1.05rem; /* Slightly smaller base font for mobile harmony */
        max-width: 100%;
        overflow-wrap: break-word;
      }
      @media (min-width: 768px) {
        .gh-content { font-size: 1.125rem; }
      }

      .gh-content h1, .gh-content h2, .gh-content h3, 
      .gh-content h4, .gh-content h5, .gh-content h6 {
        font-family: 'Tenor Sans', sans-serif;
        color: #111110;
        font-weight: 400;
        letter-spacing: 0.05em; 
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        line-height: 1.3;
        scroll-margin-top: 100px;
        text-transform: uppercase;
      }
      
      .gh-content h2 { font-size: 1.5rem; border-bottom: 1px solid #e7e5e4; padding-bottom: 0.5rem; }
      .gh-content h3 { font-size: 1.25rem; }
      
      @media (min-width: 768px) {
        .gh-content h2 { font-size: 2rem; }
        .gh-content h3 { font-size: 1.5rem; }
        .gh-content h1, .gh-content h2, .gh-content h3 { margin-top: 3.5rem; margin-bottom: 1.5rem; }
      }

      .gh-content p { margin-bottom: 1.5rem; }
      .gh-content ul, .gh-content ol { margin-bottom: 1.5rem; padding-left: 1.5rem; }
      .gh-content li { margin-bottom: 0.5rem; padding-left: 0.5rem; }

      .gh-content blockquote {
        border-left: 2px solid #111110;
        padding-left: 1.5rem;
        margin: 2.5rem 0;
        font-family: 'Tenor Sans', sans-serif;
        font-size: 1.25rem;
        color: #111110;
        background: transparent;
        line-height: 1.4;
      }
      @media (min-width: 768px) {
        .gh-content blockquote { font-size: 1.6rem; padding-left: 2rem; margin: 3rem 0; }
      }

      .gh-content a {
        color: #111110;
        text-decoration: underline;
        text-decoration-color: #d6d3d1;
        text-underline-offset: 4px;
        transition: all 0.2s;
      }
      .gh-content a:hover { text-decoration-color: #111110; }

      .gh-content img { max-width: 100%; height: auto; margin: 1.5rem auto; display: block; }
      @media (min-width: 768px) {
        .gh-content img { margin: 2rem auto; }
      }
      
      /* --- REFINED INTERNAL LINK CARD (Enhanced Visibility) --- */
      .da-internal-card {
        margin: 3.5rem 0;
        width: 100%;
        max-width: 100%;
        background: #fff;
        border: 1px solid #d6d3d1; 
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        position: relative;
        box-sizing: border-box;
        overflow: hidden;
        box-shadow: 0 4px 15px -3px rgba(0,0,0,0.03);
      }
      @media (min-width: 768px) {
        .da-internal-card { margin: 4.5rem 0; }
      }
      
      .da-internal-card::before {
        content: "Featured Story";
        position: absolute;
        top: 0;
        left: 0;
        background: #111110;
        color: #fff;
        padding: 4px 10px;
        font-size: 8px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        z-index: 10;
      }

      .da-internal-card:hover {
        border-color: #111110; 
        box-shadow: 0 20px 50px -15px rgba(0,0,0,0.08);
        transform: translateY(-2px);
      }
      
      .da-internal-card a {
        display: flex;
        text-decoration: none !important;
        color: inherit !important;
        width: 100%;
      }
      
      .da-internal-image {
        width: 35%;
        min-width: 100px;
        aspect-ratio: 1;
        overflow: hidden;
        background: #f5f5f4;
        flex-shrink: 0;
        position: relative;
      }
      
      .da-internal-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        margin: 0 !important;
        transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1);
      }
      
      .da-internal-card:hover .da-internal-image img {
        transform: scale(1.05);
      }
      
      .da-internal-content {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-grow: 1;
        position: relative;
        border-left: 1px solid #d6d3d1;
        min-width: 0;
      }
      @media (min-width: 768px) {
        .da-internal-content { padding: 2.5rem; }
      }
      
      .da-internal-tag {
        font-family: 'Manrope', sans-serif !important;
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #78716c; 
        margin-bottom: 0.5rem;
        display: block;
      }
      
      .da-internal-title {
        font-family: 'Tenor Sans', sans-serif !important;
        font-size: 1.1rem !important;
        color: #111110 !important;
        margin: 0 0 0.5rem 0 !important;
        line-height: 1.3 !important;
        text-transform: none !important;
        letter-spacing: -0.01em !important;
        font-weight: 400 !important;
      }
      @media (min-width: 768px) {
        .da-internal-title { font-size: 1.35rem !important; margin: 0 0 0.75rem 0 !important; }
      }
      
      .da-internal-excerpt {
        font-size: 0.85rem;
        color: #57534e; 
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 1rem;
        font-weight: 300;
      }
      
      .da-internal-cta {
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #111110;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      
      .da-internal-cta::after {
        content: "";
        width: 12px;
        height: 1px;
        background: #111110;
        display: block;
        transition: width 0.3s ease;
      }
      
      .da-internal-card:hover .da-internal-cta::after {
        width: 20px;
      }

      @media (max-width: 1024px) {
        .da-internal-image { width: 30%; }
        .da-internal-content { padding: 1.25rem; }
      }

      @media (max-width: 640px) {
        .da-internal-card { margin: 2.5rem 0; }
        .da-internal-card a { flex-direction: column; }
        .da-internal-image { width: 100%; aspect-ratio: 16/9; }
        .da-internal-content { padding: 1.25rem; border-left: none; border-top: 1px solid #d6d3d1; }
        .da-internal-title { font-size: 1.15rem !important; }
      }

      /* --- PRODUCT CARD STYLES --- */
      .gh-content .kg-product-card {
        background: #fff;
        border: 1px solid #d6d3d1; 
        border-radius: 4px;
        margin: 1.5rem 0;
        width: 100%;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      @media (min-width: 768px) {
        .gh-content .kg-product-card { margin: 2rem 0; }
      }
      .gh-content .kg-product-card:hover {
        border-color: #111110;
        box-shadow: 0 10px 30px -10px rgba(0,0,0,0.08);
      }
      .gh-content .kg-product-card-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.75rem;
        padding: 1.25rem;
        align-items: start;
      }
      .gh-content .kg-product-card-image {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: contain;
        background-color: #fafaf9;
        border-radius: 2px;
        margin: 0 !important;
      }
      .gh-content .kg-product-card-title {
        font-family: 'Tenor Sans', sans-serif !important;
        font-size: 1.15rem !important;
        margin: 0 !important;
        text-transform: none !important;
        font-weight: 500 !important;
        line-height: 1.2 !important;
      }
      @media (min-width: 768px) {
        .gh-content .kg-product-card-title { font-size: 1.25rem !important; }
        .gh-content .kg-product-card-image { aspect-ratio: 4/3; }
      }
      .gh-content .kg-product-card-description {
        font-family: 'Manrope', sans-serif;
        font-size: 0.9rem;
        color: #78716c;
        line-height: 1.5;
      }
      .gh-content .kg-product-card-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        margin-top: 0.5rem;
        padding: 0.65rem 1.25rem;
        background-color: #111110;
        color: white !important;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        text-decoration: none !important;
        transition: background-color 0.2s;
        border-radius: 2px;
        width: 100%;
      }
      @media (min-width: 768px) {
        .gh-content .kg-product-card-container {
          grid-template-columns: 240px 1fr;
          grid-template-rows: auto auto 1fr;
          column-gap: 2rem;
          row-gap: 0.5rem;
          padding: 1.5rem;
        }
        .gh-content .kg-product-card-image { grid-column: 1; grid-row: 1 / span 4; max-height: 240px; }
        .gh-content .kg-product-card-button { width: fit-content; padding: 0.75rem 1.5rem; font-size: 0.8rem; }
      }
    </style>
